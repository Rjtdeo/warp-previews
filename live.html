<title>Parcel Rates Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Every value below is from src/app/portal/portal.css. This page is meant to
   be indistinguishable from the shipped portal apart from the rate results
   themselves, so nothing here is a fresh design decision. */
:root{
  --green:#3ddc84;--green-dim:#32c472;
  --green-glow:rgba(61,220,132,.1);--green-soft:rgba(61,220,132,.28);
  --s0:#121518;--s1:#161a1f;--s2:#1b2027;--s3:#222731;--s4:#2f3641;
  --border:#2a303a;--border-subtle:#222731;--border-strong:#383f4c;
  --text:#f0f2f5;--text-2:#d5dae1;--muted:#a2abb6;--dim:#78828e;
  --warning:#fbbf24;--info:#60a5fa;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--s0);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.025em;font-weight:600;line-height:1.2;margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
::selection{background:rgba(61,220,132,.15)}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{height:100vh;display:flex;overflow:hidden;background:var(--s0)}
.sidebar{width:240px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-logo{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--green);border:1px solid var(--green-soft);border-radius:5px;padding:3px 8px}
.nav{flex:1;padding:12px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--text-2);background:var(--s2)}
.nav a.active{color:var(--green);background:var(--green-glow)}
.nav svg{flex-shrink:0}
.side-foot{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-2);flex-shrink:0}
.side-foot .who{min-width:0}
.side-foot .em{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .co{font-size:11px;color:var(--dim)}

.body{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.tenant{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2)}
.top-actions{display:flex;align-items:center;gap:14px}
.btn{font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:7px 14px;border-radius:var(--radius-sm);border:none;background:var(--green);color:var(--s0)}
.linkish{font-size:12.5px;color:var(--muted);text-decoration:none}
.linkish:hover{color:var(--text)}
.main{flex:1;overflow-y:auto;padding:26px 22px 70px}
.inner{max-width:1180px;margin:0 auto;display:grid;gap:20px}

/* ── page head + quote form ───────────────────────────────────────── */
.h1{font-size:24px}
.sub{color:var(--muted);font-size:13.5px;margin:5px 0 0;max-width:640px}
.glass{position:relative;background:var(--s1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:grid;gap:12px}
/* Lane control, matching customer.wearewarp.com/dashboard/freight-quote:
   the ZIP is what you type and it sits centred in the box; the city it
   resolves to is confirmation, so it goes underneath in muted text rather
   than being crammed into the field. */
.lane-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.lane-field{display:grid;gap:4px}
.lane-label{font-size:13.5px;color:var(--text-2);font-weight:500}
.zip{font:inherit;font-size:15px;font-weight:600;text-align:center;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;padding:9px 12px;border-radius:9px;
  background:var(--s0);border:1px solid var(--border);color:var(--text);width:100%}
.zip{cursor:text}
.zip:hover{border-color:var(--border-strong);background:var(--s1)}
.zip:focus{outline:none;border-color:var(--green-soft);background:var(--s1);
  box-shadow:0 0 0 3px var(--green-glow)}
.zip-city{font-size:11.5px;color:var(--muted);text-align:center;min-height:16px}
.zip-city.unknown{color:var(--warning)}
.lane-arrow{color:var(--dim);font-size:17px;padding-top:4px}
@media(max-width:620px){.lane-row{grid-template-columns:1fr}.lane-arrow{display:none}}
/* Absolute, not its own row. As a flex row it reserved a full band across
   the top of the card for one small button, and the band read as a gap. The
   label line beside "To" is already empty, so it sits there instead. */
.lane-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.frow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field{display:grid;gap:5px;flex:1 1 150px}
.label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.label .req{color:var(--green)}
.input{font:inherit;font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);background:var(--s0);border:1px solid var(--border);color:var(--text);width:100%}
.input:hover{border-color:var(--border-strong)}
select.input{appearance:none;cursor:pointer}
.ghost{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;border:none;color:var(--muted)}
.ghost:hover{color:var(--text)}

/* ── results ──────────────────────────────────────────────────────── */
.res-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.res-head h2{font-size:18px}
.res-sub{color:var(--muted);font-size:13px}
.lane-to{color:var(--dim);padding:0 3px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fact{font-size:11px;font-weight:600;color:var(--muted);background:var(--s2);
  border:1px solid var(--border);border-radius:6px;padding:3px 9px;white-space:nowrap}
.fact b{color:var(--text-2);font-weight:600}
.sep-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--green);vertical-align:middle;margin:0 8px 2px}
.count{text-align:right;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.count b{color:var(--green);font-size:17px;font-family:var(--mono)}
.count .sub2{display:block;font-size:11px;color:var(--dim)}

/* the chosen treatment: bare chips, no container */
.res-panel{background:var(--s1);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:18px}
.res-rule{height:1px;background:var(--border);margin:12px -16px 11px}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* Inside a panel a filled chip reads as a card within a card, so the fill
   comes off and only the selected one keeps a background. */
.res-panel .chip-f{background:transparent}
.res-panel .chip-f:hover{background:var(--s2)}
.res-panel .chip-f[aria-selected="true"]{background:var(--green-glow)}
/* A dot, not a hairline. This was a 1px green rule and a single pixel of
   colour at 18px tall just reads as a dark line — the green was there and
   invisible. Same 4px dot as the lane line above, so both separators on the
   page mean the same thing and this one can actually be seen. */
/* Full height, but dissolving before it reaches either horizontal.
   A solid green rule that landed on the grey divider above and the panel edge
   below put two lines meeting at right angles in two different colours, and
   that mismatch was more conspicuous than the green itself. Fading out at
   both ends means nothing has to match: it divides the row without claiming
   to be part of the frame. */
.sep{width:1px;align-self:stretch;flex:none;margin:-11px 12px -14px;
  background:linear-gradient(to bottom,transparent,var(--green) 35%,var(--green) 65%,transparent)}
.chip-f{font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:5px 11px;border-radius:999px;background:var(--s1);color:var(--muted);border:1px solid transparent}
.chip-f:hover{color:var(--text);background:var(--s2)}
.chip-f[aria-selected="true"]{background:var(--green-glow);color:var(--green);border-color:var(--green-soft)}

.stacks{display:grid;gap:24px}
.tier-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.tier-head h3{font-size:15px}
.tier-blurb{font-size:12px;color:var(--muted);flex:1 1 auto}
.tier-count{font-size:11px;color:var(--dim);font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px}
/* Every card the same height, so a note in one tier does not make that
   whole row taller than the tier above it. Cards already stretch to
   match WITHIN a row; this extends that across the page. */
.card{position:relative;display:flex;flex-direction:column;border-radius:18px;padding:18px 18px 15px;background:var(--s1);border:1px solid var(--border);transition:transform .22s cubic-bezier(.23,1,.32,1),box-shadow .22s,border-color .18s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(0,0,0,.5);border-color:var(--border-strong)}
/* The recommended card is a green TINT and border, with no gradient bar
   across the top. The bar was doing the same job twice and the fade-out
   made it read as decoration rather than as a signal. */
.card.best{background:rgba(61,220,132,.07);border-color:var(--green-soft)}
.card.best:hover{border-color:rgba(61,220,132,.45)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:var(--text-2);white-space:nowrap}
.chip.green{background:var(--green-glow);border-color:var(--green-soft);color:var(--green)}
.flag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.card-price{font-size:30px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:8px}
.card-arrive{font-size:13.5px;font-weight:600;margin-bottom:11px;letter-spacing:-.01em}
.card-arrive .rel{color:var(--muted);font-weight:500}
.card-meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin-bottom:14px}
.card-meta.grow{flex-grow:1}
.gchip{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--border);border-radius:5px;padding:2px 6px;white-space:nowrap}
/* Own tooltip: native title= waits about a second and the delay cannot be
   configured. Instant here, and reachable by keyboard and by tap. */
.mark{position:relative;cursor:help;color:var(--warning);font-weight:700;
  border-bottom:1px dotted var(--border-strong)}
.mark .tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  width:max-content;max-width:210px;text-align:left;background:var(--s4);color:var(--text-2);
  border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;font-size:11px;
  font-weight:500;line-height:1.45;opacity:0;visibility:hidden;z-index:6;pointer-events:none;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.mark:hover .tip,.mark:focus .tip,.mark.open .tip{opacity:1;visibility:visible}
.mark .tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--border-strong)}
.card-gtd{color:var(--dim);font-size:11.5px}
/* Disclaimer, same as the freight mockup: an amber asterisk against dim
   text. The dashed rule this replaces drew a line across the card for a
   note that is a footnote, not a section. */
.card-note{display:flex;gap:6px;font-size:11px;line-height:1.45;color:var(--dim);margin-bottom:11px}
.card-note + .card-note{margin-top:-6px}
.card-note .star{color:var(--warning);font-weight:700;flex-shrink:0}
.card-cta{width:100%;border-radius:10px;padding:9px 0;font:inherit;font-size:12.5px;font-weight:700;border:none;cursor:pointer;background:rgba(255,255,255,.07);color:var(--text)}
.card-cta:hover{background:rgba(255,255,255,.12)}
.card-cta.primary{background:var(--green);color:var(--s0)}
.card-cta.primary:hover{background:var(--green-dim)}
.fold{font:inherit;font-size:12px;cursor:pointer;text-align:left;background:transparent;border:none;color:var(--muted);padding:10px 0 0}
.fold:hover{color:var(--text)}
.fold .hint{color:var(--dim)}
.empty{color:var(--muted);font-size:13px;padding:20px 0}
/* A row built for four leaves a lone card stretched across the whole width.
   Capped tracks keep cards their own size and sit them left instead. */
.grid.capped{grid-template-columns:repeat(auto-fill,minmax(0,240px));justify-content:start}
.merged-head{margin-bottom:12px}
.merged-head h3{font-size:16px;margin-bottom:3px}
.merged-head p{margin:0;font-size:12.5px;color:var(--muted);max-width:62ch}

@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }
@media (max-width:900px){ .sidebar{display:none} }
</style>

<div id="app"></div>
<script>
const SHIP_DATE = '2026-09-02';
const ARRIVAL = {
  1: '2026-09-03', 2: '2026-09-04', 3: '2026-09-08',
  4: '2026-09-09', 5: '2026-09-10', 6: '2026-09-11',
};

const r = (id, carrier, service, amount, days, guaranteed = false, warnings = []) => ({
  rate_id: id, carrier_code: carrier, service_type: service,
  total_amount: { currency: 'usd', amount }, delivery_days: days,
  estimated_delivery_date: ARRIVAL[days] || null, guaranteed_service: guaranteed, warnings,
});

const LONG_RATES = [
  r('l-01', 'ups', 'UPS® Ground Saver', 12.85, 5),
  r('l-02', 'stamps_com', 'USPS Ground Advantage', 13.40, 5),
  r('l-03', 'fedex', 'FedEx Ground® Economy', 14.20, 6),
  r('l-04', 'ups', 'UPS® Ground', 16.75, 4),
  r('l-05', 'fedex', 'FedEx Home Delivery®', 17.90, 4),
  r('l-06', 'stamps_com', 'USPS Priority Mail®', 19.60, 3),
  r('l-07', 'ups', 'UPS 3 Day Select®', 28.40, 3, true),
  r('l-08', 'fedex', 'FedEx Express Saver®', 31.15, 3, true),
  r('l-09', 'fedex', 'FedEx 2Day®', 44.80, 2, true),
  r('l-10', 'ups', 'UPS 2nd Day Air®', 47.20, 2, true),
  r('l-11', 'stamps_com', 'USPS Priority Mail Express®', 52.95, 2, true),
  r('l-12', 'fedex', 'FedEx 2Day® A.M.', 58.30, 2, true),
  r('l-13', 'ups', 'UPS 2nd Day Air® A.M.', 61.75, 2, true),
  r('l-14', 'ups', 'UPS Next Day Air Saver®', 89.40, 1, true),
  r('l-15', 'fedex', 'FedEx Standard Overnight®', 94.60, 1, true),
  r('l-16', 'ups', 'UPS Next Day Air®', 108.20, 1, true),
  r('l-17', 'fedex', 'FedEx Priority Overnight®', 112.85, 1, true),
  r('l-18', 'dhl_express', 'DHL Express Worldwide', 142.50, 2, true),
  r('l-19', 'ups', 'UPS Next Day Air® Early', 156.30, 1, true),
  r('l-20', 'fedex', 'FedEx First Overnight®', 168.90, 1, true),
];

const METRO_RATES = [
  r('m-01', 'ups', 'UPS® Ground Saver', 6.40, 2),
  r('m-02', 'stamps_com', 'USPS Ground Advantage', 6.65, 2),
  r('m-03', 'ups', 'UPS® Ground', 7.41, 1),
  r('m-04', 'fedex', 'FedEx Ground® Economy', 8.90, 3),
  r('m-05', 'stamps_com', 'USPS Priority Mail®', 9.85, 2),
  r('m-06', 'fedex', 'FedEx Home Delivery®', 10.12, 2),
  r('m-07', 'ups', 'UPS 3 Day Select®', 13.20, 3, true),
  r('m-08', 'fedex', 'FedEx Express Saver®', 15.62, 3, true),
  r('m-09', 'fedex', 'FedEx 2Day®', 22.40, 2, true),
  r('m-10', 'ups', 'UPS 2nd Day Air®', 24.15, 2, true),
  r('m-11', 'fedex', 'FedEx 2Day® A.M.', 29.85, 2, true),
  r('m-12', 'stamps_com', 'USPS Priority Mail Express®', 31.20, 1, true),
  r('m-13', 'ups', 'UPS 2nd Day Air® A.M.', 32.70, 2, true),
  r('m-14', 'ups', 'UPS Next Day Air Saver®', 41.60, 1, true),
  r('m-15', 'fedex', 'FedEx Standard Overnight®', 44.90, 1, true),
  r('m-16', 'ups', 'UPS Next Day Air®', 52.30, 1, true),
  r('m-17', 'fedex', 'FedEx Priority Overnight®', 56.75, 1, true),
  r('m-18', 'ups', 'UPS Next Day Air® Early', 78.40, 1, true),
  r('m-19', 'fedex', 'FedEx First Overnight®', 84.20, 1, true),
  r('m-20', 'dhl_express', 'DHL Express Worldwide', 91.05, 2, true),
  r('m-21', 'dhl_express', 'DHL Express 12:00', 118.30, 1, true),
  r('m-22', 'dhl_express', 'DHL Express 9:00', 146.75, 1, true),
];

const SCENARIOS = [
  {
    id: 'long', name: 'LA → Chicago',
    lane: { from: 'Los Angeles, CA 90013', to: 'Chicago, IL 60607', packages: '1 package · 5 lb · 12 × 9 × 4 in' },
    tests: 'Twenty rates with real spread — five days of ground through overnight. Tests density.',
    rates: LONG_RATES, sway: null,
  },
  {
    id: 'metro', name: 'LA → San Diego',
    lane: { from: 'Los Angeles, CA 90013', to: 'San Diego, CA 92101', packages: '1 package · 5 lb · 12 × 9 × 4 in' },
    tests: 'Twenty-three rates that nearly all collapse — ground is already next-day, and Sway beats the express tier. Tests sparsity.',
    rates: METRO_RATES,
    sway: { rates: [{ service_type: 'EXPEDITED', transit_days: 1, total_amount: { currency: 'usd', amount: 12.50 } }], dropOffName: 'Sway Santa Ana', dropOffCutoff: '7:00pm for NorCal and TX' },
  },
];

/* ═══════════════════════════════════════════════════════════════════
   The model. What the rate list MEANS, kept apart from how it is
   drawn, so the five views below differ in layout and never in data.
   ═══════════════════════════════════════════════════════════════════ */

const CARRIERS = { ups: 'UPS', fedex: 'FedEx', stamps_com: 'USPS', usps: 'USPS', dhl_express: 'DHL', sway: 'Sway' };
const carrierLabel = (c) => CARRIERS[c] || c.replace(/_/g, ' ').toUpperCase();

/* B beats A when it is no worse on every axis and strictly better on one.
   The guarantee is the third axis; without it the whole express tier reads
   as redundant on a short lane. */
function dominates(b, a) {
  if (b.days == null || a.days == null) return false;
  const noWorse = b.price <= a.price && b.days <= a.days && b.guaranteed >= a.guaranteed;
  const better = b.price < a.price || b.days < a.days || b.guaranteed > a.guaranteed;
  return noWorse && better;
}

function buildModel(scenario) {
  const options = [
    ...(scenario.sway ? scenario.sway.rates.map((x) => ({
      key: 'sway-' + x.service_type, carrier: 'Sway',
      service: x.service_type[0] + x.service_type.slice(1).toLowerCase() + ' metro',
      price: x.total_amount.amount, days: x.transit_days, arrivalISO: null, guaranteed: 1,
      conditions: ['Drop-off required at ' + scenario.sway.dropOffName
          + ', cutoff ' + (scenario.sway.dropOffCutoff || '—')],
    })) : []),
    ...scenario.rates.map((x) => ({
      key: x.rate_id, carrier: carrierLabel(x.carrier_code), service: x.service_type,
      price: x.total_amount.amount, days: x.delivery_days, arrivalISO: x.estimated_delivery_date,
      guaranteed: x.guaranteed_service ? 1 : 0, conditions: x.warnings || [],
    })),
  ].sort((a, b) => a.price - b.price);

  options.forEach((a) => {
    const w = options.find((b) => b.key !== a.key && dominates(b, a));
    a.dominatedBy = w ? w.key : null;
  });

  const frontier = options.filter((o) => !o.dominatedBy);
  const dominated = options.filter((o) => o.dominatedBy);
  const timed = options.filter((o) => o.days != null);
  const cheapest = options[0] || null;
  const fastest = timed.length
    ? timed.reduce((best, o) => (o.days < best.days || (o.days === best.days && o.price < best.price) ? o : best))
    : null;

  /* The knee: most days saved per extra dollar, measured from cheapest. */
  let bestValue = null, bestSlope = 0;
  if (cheapest && cheapest.days != null) {
    frontier.forEach((o) => {
      if (o.key === cheapest.key || o.days == null) return;
      const saved = cheapest.days - o.days, extra = o.price - cheapest.price;
      if (saved <= 0 || extra <= 0) return;
      const slope = saved / extra;
      if (slope > bestSlope) { bestSlope = slope; bestValue = o; }
    });
  }

  /* Grouped by transit days, not date — Sway quotes a day count and never
     a date, and keying on the date would file it into a phantom group. */
  const map = new Map();
  options.forEach((o) => {
    const k = o.days != null ? 'd' + o.days : 'unknown';
    const g = map.get(k) || { arrivalISO: null, days: o.days, options: [], from: Infinity };
    g.options.push(o);
    g.from = Math.min(g.from, o.price);
    g.arrivalISO = g.arrivalISO || o.arrivalISO;
    map.set(k, g);
  });
  const arrivals = [...map.values()].sort((a, b) => (a.days ?? 99) - (b.days ?? 99));

  return { options, frontier, dominated, cheapest, fastest, bestValue, arrivals, totalCount: options.length };
}

const ZIP_GEO = {

  '92101': [32.72, -117.16], '60607': [41.87, -87.65], '33136': [25.78, -80.20],

  '73301': [30.27, -97.74], '30301': [33.75, -84.39], '02108': [42.36, -71.06],
};
/* Rough centre of each ZIP1 region, so an unlisted ZIP still lands on the
   right side of the country instead of falling back to a single point. */
const ZIP1_GEO = [
  [43.0, -71.5], [42.9, -75.5], [39.0, -76.5], [35.5, -80.0], [39.5, -83.0],
  [41.5, -89.0], [38.5, -94.5], [45.0, -100.0], [35.0, -110.0], [37.5, -120.0],
];
function geo(zip) {
  if (ZIP_GEO[zip]) return ZIP_GEO[zip];
  const d = Number(String(zip)[0]);
  return ZIP1_GEO[Number.isFinite(d) ? d : 5];
}
function milesBetween(a, b) {
  const [la1, lo1] = geo(a), [la2, lo2] = geo(b);
  const R = 3958.8, rad = Math.PI / 180;
  const dLa = (la2 - la1) * rad, dLo = (lo2 - lo1) * rad;
  const h = Math.sin(dLa / 2) ** 2
    + Math.cos(la1 * rad) * Math.cos(la2 * rad) * Math.sin(dLo / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

/* Business days, skipping weekends and Labor Day 2026. */
function addBusinessDays(iso, n) {
  const HOLIDAYS = new Set(['2026-09-07']);
  const d = new Date(iso + 'T12:00:00Z');
  let left = n;
  while (left > 0) {
    d.setUTCDate(d.getUTCDate() + 1);
    const day = d.getUTCDay();
    const key = d.toISOString().slice(0, 10);
    if (day !== 0 && day !== 6 && !HOLIDAYS.has(key)) left -= 1;
  }
  return d.toISOString().slice(0, 10);
}

function quoteFor(fromZip, toZip, lbs, dims) {
  const mi = milesBetween(fromZip, toZip);
  const actual = Math.max(0.5, Number(lbs) || 5);
  /* Dimensional weight, so the dimension boxes are not decoration: a tube is
     mostly air and carriers bill it by the space it occupies. Billable is the
     greater of actual and L×W×H/139, the standard domestic divisor.
     NOTE: this is a proposal, not current behaviour — the repo's README lists
     "dim-weight audit" as roadmap and the live page bills actual weight only. */
  const [L, W, H] = (dims || []).map((x) => Number(x) || 0);
  const dimW = L && W && H ? (L * W * H) / 139 : 0;
  const w = Math.max(actual, dimW);
  const groundBase = 3.17 + 0.00397 * mi + 0.55 * w;
  const groundDays = Math.min(6, Math.max(1, Math.ceil(mi / 450)));

  const daysFor = (rule) => rule === 'ground' ? groundDays
    : rule === 'ground+1' ? Math.min(6, groundDays + 1)
    : rule === 'ground+2' ? Math.min(6, groundDays + 2)
    : rule === 'cap3' ? Math.min(3, groundDays)
    : Number(rule.replace('fixed', ''));

  const rates = SERVICES.map((sv, i) => {
    const [carrier, name, mult, rule, gtd, warnings] = sv;
    const days = daysFor(rule);
    /* Express is priced off distance on its own curve, not off the ground
       rate: fitted through both fixture lanes (UPS Next Day Air Saver at
       $41.60 over 111 mi and $89.40 over 1,741 mi), which reproduces the
       other express rows to within a few percent. An earlier version added a
       flat uplift to ground and put an $80 overnight on a 111-mile lane. */
    const price = rule.startsWith('fixed')
      ? Math.round(mult * (5.5093 + 0.004213 * mi) * 100) / 100
      : Math.round(groundBase * mult * 100) / 100;
    return {
      rate_id: 'g-' + i, carrier_code: carrier, service_type: name,
      total_amount: { currency: 'usd', amount: price },
      delivery_days: days, estimated_delivery_date: addBusinessDays(SHIP_DATE, days),
      guaranteed_service: gtd, warnings: warnings || [],
    };
  }).sort((a, b) => a.total_amount.amount - b.total_amount.amount);

  /* Sway needs a hub in the origin state and only sells its own metro. */
  const st = stateOfZip(fromZip);
  /* Real facilities, from src/lib/shipsway/facilities.ts. An earlier version
     of this mock said "Warp LAX Hub, cutoff 2:00pm" — a hub that does not
     exist and a cutoff nobody set. The customer is being told where to drive
     a parcel; inventing that address is not a harmless placeholder. The line
     is built the way swayDropOffSummary() builds it: name, then the first
     clause of the cutoff. */
  const HUBS = {
    CA: { name: 'Sway Santa Ana', cutoff: '7:00pm for NorCal and TX' },
    NJ: { name: 'Sway Elmwood Park', cutoff: '8:00pm' },
  };
  const hubInfo = HUBS[st] || null;
  const hub = hubInfo ? hubInfo.name : null;
  const sway = (hub && mi <= 150 && w <= 25)
    ? { rates: [{ service_type: 'EXPEDITED', transit_days: 1,
        total_amount: { currency: 'usd', amount: Math.round((9 + 0.03 * mi) * 100) / 100 } }],
        dropOffName: hub, dropOffCutoff: hubInfo.cutoff }
    : null;

  return { rates, sway, miles: mi, billable: Math.round(w * 10) / 10, dimApplied: dimW > actual };
}

/* Filter BEFORE ranking, so a tier never names a winner the filter hid. */
function scoped() {

function tiersOf(list) {
  if (!list.length) return { cheapest: [], fastest: [], balanced: [] };
  const prices = list.map((o) => o.price), days = list.map((o) => o.days ?? 99);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const minT = Math.min(...days), maxT = Math.max(...days);
  const score = (o) => (o.price - minP) / Math.max(1, maxP - minP)
    + ((o.days ?? 99) - minT) / Math.max(1, maxT - minT);
  return {
    cheapest: [...list].sort((a, b) => a.price - b.price),
    fastest: [...list].sort((a, b) => (a.days ?? 99) - (b.days ?? 99) || a.price - b.price),
    balanced: [...list].sort((a, b) => score(a) - score(b)),
  };
}

/* Three headings over three identical lists is three answers to a question
   that only had one. Once every tier ranks the same rows the same way, the
   tiers have stopped carrying information and are folded into one. */
function tiersAgree(t) {
  const key = (l) => l.map((o) => o.key).join('|');
  return key(t.cheapest) === key(t.fastest) && key(t.fastest) === key(t.balanced);
}

function card(o, lead, tierLabel) {
  /* The date leads; how far away it is goes in brackets after it. A middot
     between two time phrases read as decoration rather than punctuation.
     And when the carrier gave no date — Sway quotes a day count and never a
     date — there is only one thing to say, so "1 day - 1 business day" (the
     same fact twice, either side of a dot) collapses to "1 business day". */
  const gap = o.arrivalISO ? gapLabel(o.arrivalISO, o.days) : null;
  const when = o.arrivalISO
    ? arrivalLabel(o.arrivalISO, o.days) + (gap ? ' <span class="rel">(' + gap + ')</span>' : '')
    : (o.days != null ? o.days + ' business day' + (o.days === 1 ? '' : 's') : 'Transit varies');
  return '<div class="card' + (lead ? ' best' : '') + '"><div class="card-head">'
    + '<span class="chip' + (o.carrier === 'Sway' ? ' green' : '') + '">' + esc(o.carrier) + '</span>'
    + (o.guaranteed === 1 ? '<span class="gchip">Guaranteed</span>' : '')
    + (lead ? '<span class="flag">' + tierLabel + '</span>' : '') + '</div>'
    + '<div class="card-price">' + money(o.price) + '</div>'
    + '<div class="card-arrive">' + when + '</div>'
    /* Every card the same shape: the guarantee is a chip up in the head and
       the condition is a marker after the service name, so no card carries
       lines another card lacks. That is what lets the floor go. */
    + '<div class="card-meta grow"><span>' + esc(o.service)
    + o.conditions.map((c) => ' <span class="mark" tabindex="0" role="note" aria-label="' + esc(c)
        + '">*<span class="tip">' + esc(c) + '</span></span>').join('')
    + '</span></div>'

    + '<button class="card-cta' + (lead ? ' primary' : '') + '" type="button">Buy label →</button></div>';
}

  /* One panel for everything that describes this result set — title, lane,
     package facts, count, filters. On its own a box around six chips reads as
     empty; sharing it with the header gives the container something to hold
     and turns three loose bands into one block above the cards. */
  const panel = (extra) => '<div class="res-panel">' + head
    + '<div class="res-rule"></div>' + chips + '</div>' + extra;

  if (!list.length) {
    return panel('<p class="empty">No rates match those filters. Clear one to see the rest.</p>');
  }

  const t = tiersOf(list);

  if (tiersAgree(t)) {
    const only = list.length === 1;
    const shown = state.more.all ? list : list.slice(0, 4);
    const restN = Math.max(0, list.length - 4);
    const merged = '<div class="merged-head"><h3>'
      + (only ? 'One option matches' : list.length + ' options match') + '</h3><p>'
      + (only
        ? 'It is the cheapest, the fastest and the best balanced — there is nothing to compare it against.'
        : 'Cheapest, fastest and best balanced all rank these the same way, so they are shown once.')
      + '</p></div>'
      + '<div class="grid capped">'
      + shown.map((o, i) => card(o, i === 0, i === 0 ? 'Cheapest · Fastest · Balanced' : '')).join('')
      + '</div>'
      + (restN ? '<button class="fold" type="button" data-more="all">'
        + (state.more.all ? '▾ Show fewer' : '▸ Show ' + restN + ' more') + '</button>' : '');
    return panel(merged);
  }

  const body = '<div class="stacks">' + TIERS.map((tier) => {
    const l = t[tier.id], open = state.more[tier.id];
    const shown = open ? l : l.slice(0, 4);
    const restN = Math.max(0, l.length - 4);
    /* Fewer than four and the grid would stretch them; cap the tracks. */
    const capped = shown.length < 4 ? ' capped' : '';
    return '<section><div class="tier-head"><h3>' + tier.label + '</h3><span class="tier-blurb">'
      + tier.blurb + '</span><span class="tier-count">' + l.length + ' option'
      + (l.length === 1 ? '' : 's') + '</span></div>'
      + '<div class="grid' + capped + '">' + shown.map((o, i) => card(o, i === 0, tier.label)).join('') + '</div>'
      + (restN ? '<button class="fold" type="button" data-more="' + tier.id + '">'
        + (open ? '▾ Show fewer' : '▸ Show ' + restN + ' more')
        + '<span class="hint">' + (open ? '' : ' — ranked the same way') + '</span></button>' : '')
      + '</section>';
  }).join('') + '</div>';

  return panel(body);
}

function render() {
  /* .main is the scrolling element, and render() rebuilds it. Replacing the
     container throws its scrollTop away, so choosing a carrier from halfway
     down the results threw you back to the top of the page — away from the
     thing you had just clicked. Carry the position across the swap. */
  const prev = document.querySelector('.main');
  const keepY = prev ? prev.scrollTop : 0;

  document.getElementById('app').innerHTML =
    '<div class="shell"><aside class="sidebar">'
    + '<div class="side-logo"><span class="logo">WARP</span></div>'
    + '<nav class="nav">' + NAV.map(([label, d]) =>
      '<a href="#" class="' + (label === 'Parcel' ? 'active' : '') + '">' + icon(d) + label + '</a>').join('')
    + '</nav>'
    + '<div class="side-foot"><div class="avatar">A</div><div class="who">'
    + '<div class="em">ops@acmeoutdoor.com</div><div class="co">Acme Outdoor Co.</div></div></div>'
    + '</aside><div class="body">'
    + '<header class="topbar"><div class="tenant">Acme Outdoor Co.</div>'
    + '<div class="top-actions"><button class="btn" type="button">Get Quote</button>'
    + '<a class="linkish" href="#">Sign out</a></div></header>'
    + '<div class="main"><div class="inner">'
    + '<div><h1 class="h1">Parcel</h1><p class="sub">Rate-shop every connected carrier from city, '
    + 'state, and ZIP, then buy the label right here.</p></div>'
    + form() + results() + '</div></div></div></div>';

  /* Set synchronously, before paint, so there is no visible jump-and-return.
     The browser clamps it if the new content is shorter — filtering down to
     three cards cannot leave you scrolled past the end. */
  const next = document.querySelector('.main');
  if (next) next.scrollTop = keepY;
}

/* The quote form, arriving with the lane already answered — the hand-off
   from the dashboard widget. Only the package is left to fill in. */
/**
 * Always editable. There used to be an Edit lane button that unlocked these,
 * which meant two clicks and a mode to change five digits — and a field that
 * looks like a field but refuses typing is a small lie. Click the ZIP and
 * type; the city resolves underneath as you go.
 *
 * A <div> rather than a <label> because the label row once held a button, and
 * a button inside a label also focuses the input. The input carries its own
 * name via aria-label either way.
 */
function laneField(label, zip, city, which) {
  return '<div class="lane-field">'
    + '<div class="lane-top"><span class="lane-label">' + label + '</span></div>'
    + '<input class="zip" data-zip="' + which + '" value="' + esc(zip)
    + '" inputmode="numeric" maxlength="5" aria-label="' + label + ' ZIP code">'
    + '<span class="zip-city" data-city="' + which + '">' + esc(city) + '</span></div>';
}

function form() {
  /* Same parameter names the customer portal already uses on
     /dashboard/freight-quote — originZip, destinationZip, oc, dc — so the
     dashboard widget can hand off to either surface with one link shape. */
  if (!state.lane) {
    const q = new URLSearchParams(location.search);
    const [lfc, lfz] = splitLoc(SC.lane.from);
    const [ltc, ltz] = splitLoc(SC.lane.to);
    state.lane = {
      fromZip: q.get('originZip') || lfz, toZip: q.get('destinationZip') || ltz,
      fromCity: q.get('oc') || lfc, toCity: q.get('dc') || ltc,
    };
  }
  const { fromZip, toZip, fromCity, toCity } = state.lane;
  return '<div class="glass">'
    /* Just the control. The banner that used to sit here announced that the
       ZIPs came from the dashboard, which the customer already knows — they
       just came from it — and it took a full row to say so on every visit.
       The button carries what is actionable; nothing carries the rest. */

    + '<div class="lane-row">'
    + laneField('From', fromZip, fromCity, 'from')
    + '<span class="lane-arrow" aria-hidden="true">→</span>'
    + laneField('To', toZip, toCity, 'to')
    + '</div>'
    + '<div class="frow">'
    + '<label class="field" style="flex:1 1 190px"><span class="label">Package</span>'
    + '<select class="input" data-preset="1">'
    /* Parentheses, not a dash. The repo does not join these at all —
       Select.tsx:130 renders the hint as its own muted span beside the label
       — but a native <option> cannot style part of its text, so the size is
       bracketed as an aside instead of welded on with punctuation. */
    + PRESETS.map((x) => '<option value="' + esc(x.label) + '"'
      + (state.preset === x.label ? ' selected' : '') + '>' + esc(x.label)
      + ' (' + esc(x.hint) + ')</option>').join('')
    + '</select></label>'
    + dimField('Weight (lb)', 'wt', state.weight)
    + dimField('Length (in)', 'ln', state.l)
    + dimField('Width (in)', 'wd', state.w)
    + dimField('Height (in)', 'ht', state.h)
    + '<button class="btn" type="button" data-quote="1">Get rates</button>'
    + '<button class="ghost" type="button">+ Add package</button>'
    + '</div>'
    + '</div>';
}
const dimField = (label, id, value) =>
  '<label class="field" style="flex:1 1 108px"><span class="label">' + label + '</span>'
  + '<input class="input" id="' + id + '" value="' + esc(String(value)) + '" inputmode="decimal"></label>';

const fld = (label, value, grow) => '<label class="field" style="flex:' + grow + ' 1 '
  + (grow > 1 ? 200 : 110) + 'px"><span class="label">' + label + '</span>'
  + '<input class="input" value="' + esc(value) + '" readonly></label>';
function splitLoc(s) { const m = s.match(/^(.*),\s*([A-Z]{2})\s*(\d{5})$/); return m ? [m[1] + ', ' + m[2], m[3]] : [s, '']; }

document.addEventListener('click', (e) => {
  /* No hover on touch, so a tap opens the note and a tap elsewhere shuts it. */
  const mk = e.target.closest('.mark');
  document.querySelectorAll('.mark.open').forEach((x) => { if (x !== mk) x.classList.remove('open'); });
  if (mk) { mk.classList.toggle('open'); return; }

  const el = e.target.closest('[data-f],[data-more],[data-quote]');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.quote) {
    const num = (id, dflt) => { const el = document.getElementById(id); return el ? el.value : dflt; };
    state.weight = Math.max(0.1, Number(num('wt', state.weight)) || 5);
    state.l = num('ln', state.l); state.w = num('wd', state.w); state.h = num('ht', state.h);
    requote();
  }
  else if (el.dataset.f) { state[el.dataset.f] = el.dataset.v; state.more = {}; }
  else state.more[el.dataset.more] = !state.more[el.dataset.more];
  render();
});

/* Deliberately does NOT re-render. Rebuilding the page on every keystroke
   would destroy the input the customer is typing into and take the caret
   with it, so the ZIP and its city line are updated in place. */
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-zip]');
  if (!el) return;
  const which = el.dataset.zip;
  const zip = el.value.replace(/\D/g, '').slice(0, 5);
  if (el.value !== zip) el.value = zip;
  state.lane[which + 'Zip'] = zip;
  const city = lookupZip(zip);
  state.lane[which + 'City'] = city;
  const out = document.querySelector('[data-city="' + which + '"]');
  if (out) {
    out.textContent = city || (zip.length === 5 ? 'ZIP not recognised — rates will still be requested' : '');
    out.classList.toggle('unknown', !city && zip.length === 5);
  }
});

/* Choosing a package fills the dimension boxes from PRESETS, the way
   ParcelClient does. "Custom dimensions" carries empty strings, so it clears
   them rather than filling them — which is the point of choosing it. */
document.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-preset]');
  if (!sel) return;
  const pre = PRESETS.find((x) => x.label === sel.value);
  state.preset = sel.value;
  if (pre) {
    state.l = pre.l; state.w = pre.w; state.h = pre.h;
    if (pre.weight) state.weight = Number(pre.weight);
  }
  render();
});

/* form() seeds state.lane from the URL params, so it has to run before the
   first quote — otherwise the cards show fixture data while the form above
   them shows the lane from the URL, and the two disagree on first paint. */
form();
requote();
render();

</script>
