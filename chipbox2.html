<title>What Goes In The Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --green:#3ddc84;--green-glow:rgba(61,220,132,.1);--green-soft:rgba(61,220,132,.28);
  --s0:#121518;--s1:#161a1f;--s2:#1b2027;--s3:#222731;--s4:#2f3641;
  --border:#2a303a;--border-subtle:#222731;--border-strong:#383f4c;
  --text:#f0f2f5;--text-2:#d5dae1;--muted:#a2abb6;--dim:#78828e;
  --font:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--s0);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:44px 24px 90px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
h1{font-size:27px;letter-spacing:-.025em;margin:0 0 10px}
.lede{color:var(--muted);max-width:70ch;margin:0 0 30px}
.opt{padding:22px 0 26px;border-top:1px solid var(--border)}
.opt-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.opt-head h2{font-size:14px;margin:0;color:var(--text-2)}
.tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--green);background:var(--green-glow);border:1px solid var(--green-soft);border-radius:5px;padding:2px 7px}
.opt-note{font-size:12.5px;color:var(--dim);flex:1 1 340px;min-width:0}
.ctx{padding:0}
.cards{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{height:56px;border-radius:12px;background:var(--s1);border:1px solid var(--border)}
.mini:first-child{background:rgba(61,220,132,.07);border-color:var(--green-soft)}

/* the box itself */
.panel{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:13px 15px}
.chip{font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:5px 11px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid transparent}
.chip:hover{color:var(--text);background:var(--s2)}
.chip.on{background:var(--green-glow);color:var(--green);border-color:var(--green-soft)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gdot{width:4px;height:4px;border-radius:50%;background:var(--green);margin:0 9px;flex:none}
.spacer{margin-left:auto}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.count b{color:var(--green);font-family:var(--mono)}
.clear{font:inherit;font-size:12px;cursor:pointer;background:transparent;border:none;color:var(--dim);text-decoration:underline}
.clear:hover{color:var(--text)}
.rule{height:1px;background:var(--border);margin:11px -15px}
.title{font-size:18px;font-weight:600;letter-spacing:-.025em}
.lane{font-size:12.5px;color:var(--muted);margin-top:2px}
.lane .ar{color:var(--dim);padding:0 3px}
.facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.fact{font-size:11px;font-weight:600;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:3px 9px}
.fact b{color:var(--text-2)}
.head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tier{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 12px;border-radius:8px;background:transparent;color:var(--muted);border:none}
.tier.on{background:var(--s3);color:var(--text)}
.klabel{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-right:4px}
</style>

<div class="wrap">
  <div class="eyebrow">Warp Portal · /portal/parcel · filter row</div>
  <h1>What goes in the box with the filters</h1>
  <p class="lede">A box holding nothing but chips reads as empty, so each of these puts something in
  there with them. Same chips every time; what changes is the company they keep.</p>
  <div id="opts"></div>
</div>

<script>
const CARRIERS = ['All carriers', 'UPS', 'USPS', 'FedEx', 'Sway', 'DHL'];
const SERVICES = ['Any service', 'Guaranteed time', 'Estimated'];
const chip = (t, on) => '<button class="chip' + (on ? ' on' : '') + '" type="button">' + t + '</button>';
const cs = () => CARRIERS.map((c, i) => chip(c, i === 0)).join('');
const ss = () => SERVICES.map((c, i) => chip(c, i === 0)).join('');
const dot = '<span class="gdot"></span>';
const count = '<span class="count"><b>21</b> of 21 shown</span>';
const facts = '<div class="facts"><span class="fact">1 package</span><span class="fact"><b>5 lb</b></span>'
  + '<span class="fact">12 × 9 × 4 in</span><span class="fact"><b>1,741</b> mi</span></div>';
const laneBlock = '<div><div class="title">Rates</div>'
  + '<div class="lane">Los Angeles, CA 90013 <span class="ar">→</span> Chicago, IL 60607</div></div>';

const OPTS = [
  { name: 'A · Filters and the count', tag: '',
    note: 'The count moves off the page and into the box. The row now states what it is doing and what that leaves you with.',
    html: '<div class="panel row">' + cs() + dot + ss() + '<span class="spacer"></span>' + count + '</div>' },

  { name: 'B · The whole results header', tag: 'Recommended',
    note: 'Title, lane, package facts and filters in one panel. Everything describing this result set lives together, and the box is full because it has real work to do.',
    html: '<div class="panel"><div class="head-row">' + laneBlock
      + '<span class="spacer"></span>' + count + '</div>' + facts
      + '<div class="rule"></div><div class="row">' + cs() + dot + ss() + '</div></div>' },

  { name: 'C · Filters and the tiers', tag: '',
    note: 'The three tier headings become tabs in the same box, so every control that reorders or narrows the results sits in one place.',
    html: '<div class="panel"><div class="row"><span class="klabel">Show</span>'
      + '<button class="tier on" type="button">Cheapest</button>'
      + '<button class="tier" type="button">Fastest</button>'
      + '<button class="tier" type="button">Balanced</button>'
      + '<span class="spacer"></span>' + count + '</div>'
      + '<div class="rule"></div><div class="row">' + cs() + dot + ss() + '</div></div>' },

  { name: 'D · Labelled rows', tag: '',
    note: 'Two labelled lines inside one box. Takes a second row, and nobody has to work out which chips belong to which question.',
    html: '<div class="panel"><div class="row"><span class="klabel">Carrier</span>' + cs()
      + '<span class="spacer"></span>' + count + '</div>'
      + '<div class="row" style="margin-top:7px"><span class="klabel">Service</span>' + ss() + '</div></div>' },

  { name: 'E · Filters, count and a reset', tag: '',
    note: 'Adds the way out. A filtered view with no visible means of clearing it is a trap, and the box is the natural home for the escape.',
    html: '<div class="panel row">' + cs() + dot + ss() + '<span class="spacer"></span>'
      + count + '<button class="clear" type="button">Clear</button></div>' },
];

document.getElementById('opts').innerHTML = OPTS.map((o) =>
  '<div class="opt"><div class="opt-head"><h2>' + o.name + '</h2>'
  + (o.tag ? '<span class="tag">' + o.tag + '</span>' : '')
  + '<span class="opt-note">' + o.note + '</span></div>'
  + '<div class="ctx">' + o.html
  + '<div class="cards"><div class="mini"></div><div class="mini"></div><div class="mini"></div><div class="mini"></div></div>'
  + '</div></div>').join('');

document.addEventListener('click', (e) => {
  const b = e.target.closest('.chip, .tier');
  if (!b) return;
  const grp = b.classList.contains('tier') ? 'tier'
    : SERVICES.includes(b.textContent) ? 'svc' : 'car';
  [...b.closest('.opt').querySelectorAll('.chip, .tier')].forEach((x) => {
    const g = x.classList.contains('tier') ? 'tier'
      : SERVICES.includes(x.textContent) ? 'svc' : 'car';
    if (g === grp) x.classList.remove('on');
  });
  b.classList.add('on');
});
</script>
